name: Release APK

# 推 v 開頭的 tag 就建置並發佈，例如：
#   git tag -a v1.0 -m "..." && git push origin v1.0
# 也可以在 Actions 頁面手動觸發（拿來測流程，不會建立 Release）
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write   # 建立 Release 需要寫入權

jobs:
  build:
    runs-on: ubuntu-latest
    # secrets 不能直接用在 step 的 if 條件裡（GitHub 的限制），
    # 要先在 job 層轉成 env，下面才判斷得到有沒有設簽章金鑰。
    env:
      HAS_KEYSTORE: ${{ secrets.KEYSTORE_BASE64 != '' }}

    steps:
      - uses: actions/checkout@v4

      # 正式 tag 一定要有簽章金鑰，少了就在這裡失敗。
      # 沒擋住的話會產出 debug 簽章的 Release，而 debug 簽章的版本
      # 日後無法被正式版覆蓋更新 —— 使用者得先解除安裝，
      # 手機裡的飲食紀錄會跟著全部消失（這個 app 沒有雲端備份）。
      - name: Refuse to release without a signing key
        if: startsWith(github.ref, 'refs/tags/') && env.HAS_KEYSTORE != 'true'
        run: |
          echo "::error::缺少 KEYSTORE_BASE64 等簽章 secret，拒絕發佈 debug 簽章的 Release。"
          echo "請先設好四個 secret（見 README 發佈章節），再重新推這個 tag。"
          exit 1

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      # 有設定簽章 secret 才還原 keystore；沒有的話 build.gradle.kts
      # 會自動退回 debug 簽章，流程照樣跑得完。
      - name: Restore keystore
        if: env.HAS_KEYSTORE == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > release.jks
          cat > keystore.properties <<EOF
          storeFile=release.jks
          storePassword=$STORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF

      - run: chmod +x gradlew

      # 版號由 tag 決定，不從 build.gradle.kts 讀 ——
      # 手動維護版號遲早會忘記，而症狀是「裝置默默不更新」，很難查。
      # versionCode 用 run_number：它只會遞增，正好符合 Android 的唯一要求。
      - name: Derive version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            echo "VERSION_NAME=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          else
            # workflow_dispatch 沒有 tag，給一個一看就知道不是正式版的版號
            echo "VERSION_NAME=0.0-${GITHUB_REF_NAME}" >> "$GITHUB_ENV"
          fi
          echo "VERSION_CODE=${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"

      - name: Build release APK
        run: |
          ./gradlew assembleRelease --no-daemon \
            -PappVersionName="$VERSION_NAME" \
            -PappVersionCode="$VERSION_CODE"

      # 帶上版本名，下載後看檔名就知道是哪一版
      - name: Rename APK
        run: |
          mv app/build/outputs/apk/release/app-release.apk \
             "NutriLog-${GITHUB_REF_NAME}.apk"

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: NutriLog-${{ github.ref_name }}.apk
          generate_release_notes: true

      # 手動觸發時沒有 tag，就只留成 artifact 供下載
      - name: Upload artifact
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v4
        with:
          name: NutriLog-apk
          path: NutriLog-*.apk
